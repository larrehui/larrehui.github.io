<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>typing</title>
  <style>
    :root {
      --bg: #0a0d14;
      --panel: #111622;
      --key-bg: #1a2234;
      --key-border: #2a3652;
      --text: #f1f5f9;
      --muted: #64748b;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px;
      gap: 28px;
    }

    .topbar {
      width: 100%;
      max-width: 920px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: var(--text);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat {
      font-size: 0.9rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .btn {
      background: var(--key-bg);
      color: var(--text);
      border: 1px solid var(--key-border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .editor-wrap {
      width: 100%;
      max-width: 920px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--key-border);
      border-radius: 12px;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .keyboard {
      width: 100%;
      max-width: 920px;
      background: var(--panel);
      border: 1px solid var(--key-border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
    }

    .kb-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .key {
      position: relative;
      height: 54px;
      flex: 1;
      min-width: 36px;
      background: var(--key-bg);
      border: 1px solid var(--key-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      transition: transform 0.06s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .key.w-1-5 { flex: 1.5; }
    .key.w-1-75 { flex: 1.75; }
    .key.w-2 { flex: 2; }
    .key.w-2-25 { flex: 2.25; }
    .key.w-6 { flex: 6; }

    /* Dual-character keys (shift symbol on top in smaller font, primary below) */
    .key.dual {
      justify-content: space-between;
      padding: 6px 0 8px;
    }

    .key-sub {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1;
      transition: color 0.12s, font-size 0.12s, font-weight 0.12s;
    }

    .key-main {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
      transition: color 0.12s, opacity 0.12s;
    }

    /* Highlight shifted symbol when Shift is active */
    .keyboard.shifted .key.dual .key-sub {
      color: var(--accent);
      font-weight: 700;
    }

    .keyboard.shifted .key.dual .key-main {
      opacity: 0.55;
    }

    /* Caps Lock lock-indicator dot */
    .caps-dot {
      position: absolute;
      top: 6px;
      left: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.35;
      transition: background 0.15s, opacity 0.15s, box-shadow 0.15s;
    }

    .key.caps-on .caps-dot {
      background: #22c55e;
      opacity: 1;
      box-shadow: 0 0 6px #22c55e;
    }

    .key.active {
      transform: translateY(2px) scale(0.97);
      border-color: #fff !important;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.75);
    }

    .key-count {
      position: absolute;
      bottom: 3px;
      right: 5px;
      font-size: 0.62rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .key.visited .key-count {
      opacity: 1;
    }

    @media (max-width: 680px) {
      .keyboard {
        padding: 10px;
        gap: 5px;
      }
      .kb-row {
        gap: 4px;
      }
      .key {
        height: 44px;
        font-size: 0.75rem;
        min-width: 20px;
      }
      .key.dual {
        padding: 4px 0 5px;
      }
      .key-sub {
        font-size: 0.55rem;
      }
      .key-main {
        font-size: 0.75rem;
      }
      .key-count {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="back-link">&larr; back</a>
    <div class="controls">
      <span class="stat" id="totalStat">Keypresses: 0</span>
      <button class="btn" id="resetBtn" type="button">Reset</button>
    </div>
  </div>

  <div class="editor-wrap">
    <textarea id="typingArea" placeholder="Start typing anything here..." autofocus></textarea>
  </div>

  <div class="keyboard" id="keyboard" aria-label="On-screen keyboard">
    <!-- Row 1 -->
    <div class="kb-row">
      <div class="key dual" data-code="Backquote"><span class="key-sub">~</span><span class="key-main">`</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit1"><span class="key-sub">!</span><span class="key-main">1</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit2"><span class="key-sub">@</span><span class="key-main">2</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit3"><span class="key-sub">#</span><span class="key-main">3</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit4"><span class="key-sub">$</span><span class="key-main">4</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit5"><span class="key-sub">%</span><span class="key-main">5</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit6"><span class="key-sub">^</span><span class="key-main">6</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit7"><span class="key-sub">&amp;</span><span class="key-main">7</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit8"><span class="key-sub">*</span><span class="key-main">8</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit9"><span class="key-sub">(</span><span class="key-main">9</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Digit0"><span class="key-sub">)</span><span class="key-main">0</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Minus"><span class="key-sub">_</span><span class="key-main">-</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Equal"><span class="key-sub">+</span><span class="key-main">=</span><span class="key-count">0</span></div>
      <div class="key w-2" data-code="Backspace"><span class="key-main">Backspace</span><span class="key-count">0</span></div>
    </div>

    <!-- Row 2 -->
    <div class="kb-row">
      <div class="key w-1-5" data-code="Tab"><span class="key-main">Tab</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyQ" data-letter="q"><span class="key-main">q</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyW" data-letter="w"><span class="key-main">w</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyE" data-letter="e"><span class="key-main">e</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyR" data-letter="r"><span class="key-main">r</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyT" data-letter="t"><span class="key-main">t</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyY" data-letter="y"><span class="key-main">y</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyU" data-letter="u"><span class="key-main">u</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyI" data-letter="i"><span class="key-main">i</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyO" data-letter="o"><span class="key-main">o</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyP" data-letter="p"><span class="key-main">p</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="BracketLeft"><span class="key-sub">{</span><span class="key-main">[</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="BracketRight"><span class="key-sub">}</span><span class="key-main">]</span><span class="key-count">0</span></div>
      <div class="key dual w-1-5" data-code="Backslash"><span class="key-sub">|</span><span class="key-main">\</span><span class="key-count">0</span></div>
    </div>

    <!-- Row 3 -->
    <div class="kb-row">
      <div class="key w-1-75" data-code="CapsLock" id="capsKey"><span class="caps-dot"></span><span class="key-main">Caps</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyA" data-letter="a"><span class="key-main">a</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyS" data-letter="s"><span class="key-main">s</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyD" data-letter="d"><span class="key-main">d</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyF" data-letter="f"><span class="key-main">f</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyG" data-letter="g"><span class="key-main">g</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyH" data-letter="h"><span class="key-main">h</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyJ" data-letter="j"><span class="key-main">j</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyK" data-letter="k"><span class="key-main">k</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyL" data-letter="l"><span class="key-main">l</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Semicolon"><span class="key-sub">:</span><span class="key-main">;</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Quote"><span class="key-sub">"</span><span class="key-main">'</span><span class="key-count">0</span></div>
      <div class="key w-2-25" data-code="Enter"><span class="key-main">Enter</span><span class="key-count">0</span></div>
    </div>

    <!-- Row 4 -->
    <div class="kb-row">
      <div class="key w-2-25" data-code="ShiftLeft"><span class="key-main">Shift</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyZ" data-letter="z"><span class="key-main">z</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyX" data-letter="x"><span class="key-main">x</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyC" data-letter="c"><span class="key-main">c</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyV" data-letter="v"><span class="key-main">v</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyB" data-letter="b"><span class="key-main">b</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyN" data-letter="n"><span class="key-main">n</span><span class="key-count">0</span></div>
      <div class="key letter" data-code="KeyM" data-letter="m"><span class="key-main">m</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Comma"><span class="key-sub">&lt;</span><span class="key-main">,</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Period"><span class="key-sub">&gt;</span><span class="key-main">.</span><span class="key-count">0</span></div>
      <div class="key dual" data-code="Slash"><span class="key-sub">?</span><span class="key-main">/</span><span class="key-count">0</span></div>
      <div class="key w-2-25" data-code="ShiftRight"><span class="key-main">Shift</span><span class="key-count">0</span></div>
    </div>

    <!-- Row 5 -->
    <div class="kb-row">
      <div class="key w-6" data-code="Space"><span class="key-main">Space</span><span class="key-count">0</span></div>
    </div>
  </div>

  <script>
    const typingArea = document.getElementById('typingArea');
    const totalStat = document.getElementById('totalStat');
    const resetBtn = document.getElementById('resetBtn');
    const keyboardEl = document.getElementById('keyboard');
    const capsKey = document.getElementById('capsKey');
    const keys = document.querySelectorAll('.key');
    const letterKeys = document.querySelectorAll('.key.letter');

    const keyMap = {};
    const counts = {};
    let totalPresses = 0;
    let isShiftDown = false;
    let isCapsLocked = false;

    keys.forEach(keyEl => {
      const code = keyEl.getAttribute('data-code');
      keyMap[code] = keyEl;
      counts[code] = 0;
    });

    function updateCaseDisplay() {
      const upper = isShiftDown !== isCapsLocked;
      letterKeys.forEach(keyEl => {
        const base = keyEl.getAttribute('data-letter');
        const mainSpan = keyEl.querySelector('.key-main');
        if (mainSpan) {
          mainSpan.textContent = upper ? base.toUpperCase() : base.toLowerCase();
        }
      });

      keyboardEl.classList.toggle('shifted', isShiftDown);
      capsKey.classList.toggle('caps-on', isCapsLocked);
    }

    function syncModifiers(e) {
      isShiftDown = e.shiftKey;
      if (typeof e.getModifierState === 'function') {
        isCapsLocked = e.getModifierState('CapsLock');
      }
      updateCaseDisplay();
    }

    function updateKeyVisual(code) {
      const keyEl = keyMap[code];
      if (!keyEl) return;

      const count = counts[code];
      const countEl = keyEl.querySelector('.key-count');
      if (countEl) countEl.textContent = count;

      if (count > 0) {
        keyEl.classList.add('visited');
        const intensity = Math.min(count / 15, 1);
        const alpha = (0.18 + intensity * 0.55).toFixed(2);
        keyEl.style.backgroundColor = `rgba(56, 189, 248, ${alpha})`;
        keyEl.style.borderColor = `rgba(56, 189, 248, ${Math.min(0.4 + intensity * 0.6, 1).toFixed(2)})`;
      } else {
        keyEl.classList.remove('visited');
        keyEl.style.backgroundColor = '';
        keyEl.style.borderColor = '';
      }
    }

    window.addEventListener('keydown', (e) => {
      syncModifiers(e);

      const keyEl = keyMap[e.code];
      if (!keyEl) return;

      if (!e.repeat) {
        counts[e.code] += 1;
        totalPresses += 1;
        totalStat.textContent = `Keypresses: ${totalPresses}`;
        updateKeyVisual(e.code);
      }

      keyEl.classList.add('active');
    });

    window.addEventListener('keyup', (e) => {
      syncModifiers(e);

      const keyEl = keyMap[e.code];
      if (keyEl) {
        keyEl.classList.remove('active');
      }
    });

    window.addEventListener('blur', () => {
      isShiftDown = false;
      document.querySelectorAll('.key.active').forEach(k => k.classList.remove('active'));
      updateCaseDisplay();
    });

    resetBtn.addEventListener('click', () => {
      typingArea.value = '';
      totalPresses = 0;
      totalStat.textContent = 'Keypresses: 0';
      Object.keys(counts).forEach(code => {
        counts[code] = 0;
        updateKeyVisual(code);
      });
      typingArea.focus();
    });
  </script>
</body>
</html>
